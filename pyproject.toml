[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-signals"
version = "0.1.0"
description = "Does private-market funding activity lead public sector returns? A small, honest study."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["private_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
